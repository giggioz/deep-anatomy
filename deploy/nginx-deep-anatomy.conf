# nginx sulla VPS: /etc/nginx/sites-available/deep-anatomy (link in sites-enabled).
# Solo http: "certbot --nginx -d deepanatomy.infinitymundi.it" aggiunge https e il rimando da http.
server {
    server_name deepanatomy.infinitymundi.it;
    listen 80;

    # Importa accetta foto e PDF del referto fino a 15 MB (bodyLimit del server)
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Importa può metterci un minuto (il modello legge un PDF)
        proxy_read_timeout 120s;
    }
}
